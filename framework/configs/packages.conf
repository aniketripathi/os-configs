[required]
# Core system requirements for os-configs framework operations
git                      # Version control system
gh                       # GitHub command line tool
keychain                 # SSH agent manager for keychain authentication
p7zip                    # Command-line 7-Zip file archiver
p7zip-plugins            # Additional plugins for 7z compression formats
rclone                   # Cloud storage sync utility for Google Drive

[daily-driver]
# Daily system tools and utilities
vlc                      # Highly versatile media player
okular                   # Document viewer supporting PDF, PostScript, etc.
libreoffice              # Complete office productivity suite
htop                     # Interactive process viewer and system monitor
steam                    # Steam digital distribution platform for gaming
partitionmanager         # KDE Partition Manager for drive organization
btrfs-assistant          # GUI tool to manage BTRFS subvolumes, snapper, and rollbacks

[daily-driver-flatpak]
# Flatpak daily driver applications
eu.betterbird.Betterbird         # Email client (Betterbird fork of Thunderbird)
io.missioncenter.MissionCenter   # Beautiful GUI system resource monitor
com.bitwarden.desktop            # Bitwarden password manager desktop client
# com.obsproject.Studio            # Screen recorder and live streaming software

[development]
# Development packages installed via DNF
# (SDKMan, nvm, and JetBrains Toolbox are manually installed - see README.md)
code                     # Visual Studio Code editor

[development-flatpak]
# Development support applications
io.dbeaver.DBeaverCommunity      # Universal SQL database client and explorer
com.mongodb.Compass              # Official graphical interface for MongoDB

[uninstall]
# KDE default games
kmines                           # Minesweeper game
kpat                             # Card solitaire games
kmahjongg                        # Mahjongg tile-matching game
kajongg                          # Mahjongg game (Python-based variant)
ksudoku                          # Sudoku game
kreversi                         # Reversi board game
kbounce                          # Ball bouncing arcade game
granatier                        # Bomberman clone game
bovo                             # Five-in-a-row board game
palapeli                         # Jigsaw puzzle game

# KDE PIM (Personal Information Manager) / Akonadi organizer suite
korganizer                       # Calendar and personal organizer
kontact                          # Integrated PIM suite wrapper
kmail                            # Akonadi-based email client
akregator                        # RSS feed reader
kaddressbook                     # Contact manager
ktnef                            # TNEF (winmail.dat) viewer tool

# Redundant or unused default KDE applications
kolourpaint                      # Simple painting program
dragon                           # Simple video player (VLC is preferred)
elisa                            # Music player
plasma-vault                     # Encrypted vaults integration (unused)
